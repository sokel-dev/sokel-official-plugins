codegen:
  - {lang: go}

deployment:
  targets:
    - kind: container
      ref: ghcr.io/sokel-dev/sokel-plugin-wecom:0.3.0
  env:
    - name: SOKEL_DATA_DIR
      default: /var/lib/sokel/wecom
      required: true
      desc: Writable data directory on a persistent volume
  note: Run one replica and mount a persistent volume at /var/lib/sokel. Use the persistent Docker, Compose or Kubernetes examples in the plugin documentation.
