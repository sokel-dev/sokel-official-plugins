          - {name: from_user, label: 发送成员, type: string}
          - {name: to_user, label: 接收企业, type: string}
          - {name: agent_id, label: 应用 ID, type: string}
          - {name: message_type, label: 消息类型, type: string, required: true}
          - {name: content, label: 文字内容, type: string}
          - {name: event_type, label: 事件类型, type: string}
          - {name: event_key, label: 菜单事件键, type: string}
          - {name: change_type, label: 变更类型, type: string}
          - {name: created_at, label: 上游时间 Unix 秒, type: int, required: true}
          - {name: received_at, label: 接收时间, type: string, required: true}
          - {name: media_id, label: 媒体素材 ID, type: string}
