credential:
  auth:
    kind: oauth
    provider: google
    scopes:
    - https://www.googleapis.com/auth/calendar.events
    - https://www.googleapis.com/auth/calendar.freebusy
    - https://www.googleapis.com/auth/userinfo.email
  fields:
  - label: Access token (injected by platform)
    name: access_token
    type: secret
  - label: Refresh token (managed by platform)
    name: refresh_token
    type: secret
  - label: Polling cursor (managed automatically)
    name: poll_cursor
    type: text
  - label: Next poll time (managed automatically)
    name: next_poll_at
    type: text
  - desc: Leave empty to disable polling; primary selects the main calendar
    label: Watched calendar ID
    name: watch_calendar_id
    type: text
