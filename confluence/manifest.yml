    - label: Page ID
      name: id
      required: true
      type: string
    - label: Space ID
      name: space_id
      required: true
      type: string
    - label: Parent page ID
      name: parent_id
      required: true
      type: string
    - label: Title
      name: title
      required: true
      type: string
    - label: Status
      name: status
      required: true
      type: string
    - goType: int
      label: Current version
      name: version
      required: true
      type: number
    - label: Page body
      name: body
      required: true
      type: string
    - label: Body representation
      name: representation
      required: true
      type: string
    - label: Created at
      name: created_at
      required: true
      type: string
    - label: Web UI path
      name: web_path
      required: true
      type: string
    goType: Page
    label: Page
    name: page
    required: true
    type: json
  timeoutSec: 60
