    goType: int
    label: Page size
    name: limit
    type: number
  - label: Pagination cursor
    name: cursor
    type: string
  - label: Space key
    name: key
    type: string
  label: List spaces
  outputs:
  - fields:
    - label: Space ID
      name: id
      required: true
      type: string
    - label: Space key
      name: key
      required: true
      type: string
    - label: Name
      name: name
      required: true
      type: string
    - label: Space type
      name: type
      required: true
      type: string
    - label: Status
      name: status
      required: true
      type: string
    goType: Space
    label: Spaces
    name: spaces
    required: true
    type: array
  - label: Next cursor
    name: next_cursor
    required: true
    type: string
  timeoutSec: 60
- id: update_page
  inputs:
  - label: Page ID
    name: page_id
    required: true
    type: string
  - goType: int
    label: Expected current version
    name: expected_version
    required: true
    type: number
  - label: Title
    name: title
    required: true
    type: string
  - label: Page body
    name: body
    required: true
    type: string
  - desc: storage or atlas_doc_format; defaults to storage
    label: Body representation
    name: representation
    type: string
  - label: Version message
    name: version_message
    type: string
  label: Update page with version check
  outputs:
