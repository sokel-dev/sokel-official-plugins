  - fields:
    - label: Name
      name: name
      type: string
    - label: Description
      name: description
      type: string
    - label: Status name
      name: status
      type: string
    - goType: int
      label: Priority (1 to 4)
      name: priority
      type: number
    - goType: int64
      label: Due date in milliseconds
      name: due_date_ms
      type: number
    - label: Archived
      name: archived
      type: boolean
    - label: Include due time
      name: due_date_time
      type: boolean
    goType: TaskChanges
    label: Changed fields
    name: changes
    required: true
    type: json
  label: Update task
  outputs:
  - fields:
    - label: Task ID
      name: id
      required: true
      type: string
    - label: Name
      name: name
      required: true
      type: string
    - label: Description
      name: description
      required: true
      type: string
    - fields:
      - label: Status
        name: name
        required: true
        type: string
      - label: Status type
        name: type
        required: true
        type: string
      label: Status
      name: status
      required: true
      type: json
    - fields:
      - label: Priority name
        name: name
        required: true
        type: string
      label: Priority
      name: priority
      type: json
    - fields:
      - goType: int64
        label: User ID
        name: id
        required: true
        type: number
      - label: Username
        name: username
        required: true
        type: string
      label: Assignees
      name: assignees
      required: true
      type: array
    - label: URL
      name: url
      required: true
      type: string
    - label: Due date in milliseconds
      name: due_date_ms
      required: true
      type: string
    - label: Updated at in milliseconds
      name: updated_at_ms
      required: true
      type: string
    - label: Archived
      name: archived
      required: true
      type: boolean
    goType: Task
    label: Task
    name: task
    required: true
    type: json
  timeoutSec: 60
