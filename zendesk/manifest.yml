  - desc: Use the account name before .zendesk.com, without a URL
    label: Zendesk subdomain
    name: subdomain
    required: true
    type: text
  - desc: Email of an agent or administrator with access to the target tickets
    label: Agent email
    name: email
    required: true
    type: text
  - desc: Create an API token in Zendesk Admin Center; API token access must be enabled
    label: API token
    name: api_token
    required: true
    type: secret
