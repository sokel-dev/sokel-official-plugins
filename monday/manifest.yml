plugin:
  icon: icon.svg
  org: sokel
  name: monday
  label: Monday
  desc: Discover Monday boards and manage items, column values and updates with versioned GraphQL
  version: 0.1.1
  doc: docs/monday.md
credential:
  fields:
  - desc: Provide a personal API token with access to the target boards; manage renewal outside this plugin.
    label: API token
    name: access_token
    required: true
    type: secret
operations:
- id: add_update
  inputs:
  - label: Item ID
    name: item_id
    required: true
    type: string
  - label: Update body
    name: body
    required: true
    type: string
  label: Add item update
  outputs:
  - label: Update ID
    name: update_id
    required: true
    type: string
  - label: Update body
    name: body
    required: true
    type: string
  timeoutSec: 60
- id: change_columns
  inputs:
  - label: Board ID
    name: board_id
    required: true
    type: string
  - label: Item ID
    name: item_id
    required: true
    type: string
  - label: Column values as a JSON object string
    name: column_values_json
    required: true
    type: string
  - fields:
    - label: Create missing labels
      name: create_labels
      type: boolean
    goType: MutationOptions
    label: Mutation options
    name: options
    type: json
  label: Change item column values
  outputs:
  - fields:
    - label: Item ID
      name: id
      required: true
      type: string
    - label: Name
      name: name
      required: true
      type: string
    - label: State
      name: state
      required: true
      type: string
    - label: Item URL
      name: url
      required: true
      type: string
    - fields:
      - label: Board ID
        name: id
        required: true
        type: string
      label: Board
      name: board
      required: true
      type: json
    - fields:
      - label: Group ID
        name: id
        required: true
        type: string
      - label: Title
        name: title
        required: true
        type: string
      label: Group
      name: group
      type: json
    - fields:
      - label: Column ID
        name: id
        required: true
        type: string
      - label: Column type
        name: type
        required: true
        type: string
      - label: Display text
        name: text
        type: string
      - label: Raw value JSON
        name: value
        type: string
      label: Column values
      name: column_values
      required: true
      type: array
    goType: Item
    label: Updated item
    name: item
    required: true
    type: json
  timeoutSec: 60
- id: create_item
  inputs:
  - label: Board ID
    name: board_id
    required: true
    type: string
  - label: Name
    name: name
    required: true
    type: string
  - label: Group ID
    name: group_id
    type: string
  - label: Column values as a JSON object string
    name: column_values_json
    type: string
  - fields:
    - label: Create missing labels
      name: create_labels
      type: boolean
    goType: MutationOptions
    label: Mutation options
    name: options
    type: json
  label: Create item
  outputs:
  - fields:
    - label: Item ID
      name: id
      required: true
      type: string
    - label: Name
      name: name
      required: true
      type: string
    - label: State
      name: state
      required: true
      type: string
    - label: Item URL
      name: url
      required: true
      type: string
    - fields:
      - label: Board ID
        name: id
        required: true
        type: string
      label: Board
      name: board
      required: true
      type: json
    - fields:
      - label: Group ID
        name: id
        required: true
        type: string
      - label: Title
        name: title
        required: true
        type: string
      label: Group
      name: group
      type: json
    - fields:
      - label: Column ID
        name: id
        required: true
        type: string
      - label: Column type
        name: type
        required: true
        type: string
      - label: Display text
        name: text
        type: string
      - label: Raw value JSON
        name: value
        type: string
      label: Column values
      name: column_values
      required: true
      type: array
    goType: Item
    label: Created item
    name: item
    required: true
    type: json
  timeoutSec: 60
- id: get_board
  inputs:
