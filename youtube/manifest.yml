# Contract source; regenerate with sokel-gen generate .

plugin:
  name: youtube
  label: YouTube
  desc: 取视频信息、下载视频/音频、抓字幕文本（基于 yt-dlp）
  version: 0.2.1
  doc: docs/youtube.md


operations:
  - id: video_info
    label: 取视频信息
    desc: 只读元数据，不下载。用来在下载前判断时长/体积，或只需要标题与简介时。
    timeoutSec: 120
    inputs:
      - { name: url, label: 视频链接, type: string, required: true, desc: 视频页地址或 11 位 video id }
    outputs:
      - { name: id, label: 视频 ID, type: string, required: true }
      - { name: title, label: 标题, type: string, required: true }
      - { name: uploader, label: 频道, type: string }
      - { name: upload_date, label: 发布日期, type: string, desc: YYYY-MM-DD }
      - { name: duration_seconds, label: 时长(秒), type: int, required: true }
      - { name: view_count, label: 播放量, type: int }
      - { name: description, label: 简介, type: text }
      - { name: thumbnail, label: 封面链接, type: string }
      - { name: webpage_url, label: 规范链接, type: string, required: true }
      - { name: is_live, label: 是否直播, type: boolean }
      - { name: subtitle_langs, label: 可用字幕语言, type: strings, desc: 含自动生成的字幕 }
      - name: formats
        label: 可选清晰度
        type: array
        goType: Format
        fields:
          - { name: format_id, label: 格式 ID, type: string, required: true }
          - { name: ext, label: 容器, type: string }
          - { name: height, label: 高度, type: int }
          - { name: fps, label: 帧率, type: int }
          - { name: filesize_mb, label: 体积(MB), type: number, desc: 上游没给时为 0 }

  - id: download
    label: 下载视频
    desc: >-
      下载后把文件交回平台，画布里流转的是文件引用。**这是重活**：默认超时 15 分钟，
      且默认限制 720p / 512MB——不限的话一条 4K 长视频能把磁盘和上传通道占满。
    timeoutSec: 900
    inputs:
      - { name: url, label: 视频链接, type: string, required: true }
      - name: quality
        label: 清晰度
        type: enum
        options:
          - { value: "480", label: 480p }
          - { value: "720", label: 720p（默认） }
          - { value: "1080", label: 1080p }
          - { value: best, label: 最高（可能很大） }
        default: "720"
      - name: format_id
        label: 指定格式
        type: string
        desc: >-
          填了就忽略「清晰度」，直接下 video_info 列出的那个 format_id。
          很多下载站的「质量列表」就是这么来的：先列上游已有的流，再让你点一个。
      - name: max_filesize_mb
        label: 体积上限(MB)
        type: int
        default: 512
        desc: >-
          超过就**不下载**、直接报错——比下到一半失败可读得多。**填 0 = 不限**。
          平台侧的分块上传本身没有体积上限，真正的天花板是插件容器的磁盘与本操作的超时；
          默认给 512 只是因为「不限」意味着第一个粘 4K 长视频链接的人就能把磁盘填满，
          而那种故障看起来跟下载毫无关系。
      - { name: filename, label: 文件名, type: string, desc: 留空则用视频标题 }
    outputs:
      - { name: file, label: 文件, type: file, required: true }
      - { name: title, label: 标题, type: string, required: true }
      - { name: duration_seconds, label: 时长(秒), type: int, required: true }
      - { name: filesize_mb, label: 体积(MB), type: number, required: true }
      - { name: ext, label: 容器, type: string, required: true }
      - { name: webpage_url, label: 规范链接, type: string, required: true }
      - name: merged
        label: 是否做了合并
        type: boolean
        required: true
        desc: >-
          高清视频在上游是「视频轨 + 音频轨」两条流，取回来要用 ffmpeg 合并成一个文件
          （只是换容器，不重新编码，很快）。360p 及以下上游有单文件版，直接下就行。

  - id: download_audio
    label: 下载音频
    desc: >-
      只取音频轨。**默认不转码**——上游的音频本来就是独立的一条流，原样拿下来最快也无损失。
      指定 mp3/m4a/opus 时才会用 ffmpeg 转一道（慢一点、且是有损再压一次）。
    timeoutSec: 600
    inputs:
      - { name: url, label: 视频链接, type: string, required: true }
      - name: audio_format
        label: 音频格式
        type: enum
        options:
          - { value: source, label: 原样（不转码，最快） }
          - { value: mp3, label: MP3（转码，通用性最好） }
          - { value: m4a, label: M4A/AAC（转码） }
          - { value: opus, label: Opus（转码，同码率音质最好） }
        default: source
      - name: bitrate
        label: 码率
        type: enum
        options: ["128", "192", "256", "320"]
        default: "192"
        desc: 只在转码时有意义；原样下载时上游给多少就是多少。
      - { name: max_filesize_mb, label: 体积上限(MB), type: int, default: 256, desc: 填 0 = 不限。音频通常只有视频的十分之一，很少撞上 }
      - { name: filename, label: 文件名, type: string, desc: 留空则用视频标题 }
    outputs:
      - { name: file, label: 文件, type: file, required: true }
      - { name: title, label: 标题, type: string, required: true }
      - { name: duration_seconds, label: 时长(秒), type: int, required: true }
      - { name: filesize_mb, label: 体积(MB), type: number, required: true }
      - { name: ext, label: 容器, type: string, required: true }
      - { name: codec, label: 编码, type: string }
      - name: transcoded
        label: 是否转过码
        type: boolean
        required: true
        desc: true = 经 ffmpeg 重新编码（有损）；false = 上游原始音频轨，逐字节没动过。
      - { name: webpage_url, label: 规范链接, type: string, required: true }

  - id: transcript
    label: 抓字幕文本
    desc: >-
      取字幕并转成纯文本（去时间轴、去重复行）。优先人工字幕，没有就用自动生成的。
      不下载视频本身，比「下载→转写」快一个数量级，也不花转写的钱。
    timeoutSec: 300
    inputs:
      - { name: url, label: 视频链接, type: string, required: true }
      - { name: lang, label: 语言, type: string, default: zh-Hans, desc: 按 BCP-47 前缀匹配，如 zh / zh-Hans / en；没有该语言时回落到第一个可用字幕 }
    outputs:
      - { name: text, label: 字幕文本, type: text, required: true }
      - { name: lang_used, label: 实际语言, type: string, required: true }
      - { name: automatic, label: 是否自动生成, type: boolean, required: true, desc: 自动字幕有错字，用于摘要可以，用于引用要核对 }
      - { name: title, label: 标题, type: string, required: true }
      - { name: char_count, label: 字符数, type: int, required: true }

  - id: health_check
    label: 凭证体检
    desc: 平台约定的保留 id。这里没有凭证，检的是 yt-dlp 与 ffmpeg 在不在、以及出网通不通。
    inputs: []
    outputs:
      - { name: ok, label: 可用, type: boolean, required: true }
      - { name: message, label: 说明, type: string }

codegen:
  - { lang: python, out: sokel_gen.py }
