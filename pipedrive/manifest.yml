  desc: Manage CRM persons, organizations and deals with Pipedrive API v2
  version: 0.1.1
  doc: docs/pipedrive.md
credential:
  fields:
  - desc: Use a personal API token. Rotating it invalidates integrations using the previous token.
    label: API token
    name: api_token
    required: true
    type: secret
  - desc: Enter only the company subdomain, for example acme, from acme.pipedrive.com.
    label: Company subdomain
    name: company_domain
    required: true
    type: text
