  - fields:
    - goType: int
      label: Page size
      name: limit
      type: number
    - label: Pagination token
      name: offset
      type: string
    goType: PageOptions
    label: Pagination
    name: page
    type: json
  label: List project tasks
  outputs:
  - fields:
    - label: Task GID
      name: gid
      required: true
      type: string
    - label: Name
      name: name
      required: true
      type: string
    - label: Notes
      name: notes
      required: true
      type: string
    - label: Completed
      name: completed
      required: true
      type: boolean
    - label: Due date
      name: due_on
      required: true
      type: string
    - fields:
      - label: GID
        name: gid
        required: true
        type: string
      - label: Name
        name: name
        required: true
        type: string
      label: Assignee
      name: assignee
      type: json
    - label: Created at
      name: created_at
      required: true
      type: string
    - label: Modified at
      name: modified_at
      required: true
      type: string
    - label: Task URL
      name: url
      required: true
      type: string
    goType: Task
    label: Tasks
    name: tasks
    required: true
    type: array
  - label: Next pagination token
    name: next_offset
    required: true
    type: string
  - label: More results
    name: has_more
    required: true
    type: boolean
  timeoutSec: 60
- id: list_workspaces
  inputs:
  - fields:
    - goType: int
      label: Page size
      name: limit
      type: number
    - label: Pagination token
      name: offset
      type: string
    goType: PageOptions
    label: Pagination
    name: page
    type: json
  label: List workspaces
  outputs:
  - fields:
    - label: GID
      name: gid
      required: true
      type: string
    - label: Name
      name: name
      required: true
      type: string
    goType: Named
    label: Workspaces
    name: workspaces
    required: true
    type: array
  - label: Next pagination token
    name: next_offset
    required: true
    type: string
  - label: More results
    name: has_more
    required: true
    type: boolean
  timeoutSec: 60
- id: update_task
  inputs:
  - label: Task GID
    name: task_gid
    required: true
    type: string
  - fields:
    - label: Name
      name: name
      type: string
    - label: Notes
      name: notes
      type: string
    - label: Completed
      name: completed
      type: boolean
    - label: Assignee GID (empty clears)
      name: assignee_gid
      type: string
    - label: Due date (empty clears)
      name: due_on
      type: string
    goType: TaskChanges
    label: Changed fields
    name: changes
    required: true
    type: json
  label: Update task
  outputs:
  - fields:
    - label: Task GID
      name: gid
      required: true
      type: string
    - label: Name
      name: name
      required: true
      type: string
    - label: Notes
      name: notes
      required: true
      type: string
    - label: Completed
      name: completed
      required: true
      type: boolean
    - label: Due date
      name: due_on
      required: true
      type: string
    - fields:
      - label: GID
        name: gid
        required: true
        type: string
      - label: Name
        name: name
        required: true
        type: string
      label: Assignee
      name: assignee
      type: json
    - label: Created at
      name: created_at
      required: true
      type: string
    - label: Modified at
      name: modified_at
      required: true
      type: string
    - label: Task URL
      name: url
      required: true
      type: string
    goType: Task
    label: Task
    name: task
    required: true
    type: json
  timeoutSec: 60
