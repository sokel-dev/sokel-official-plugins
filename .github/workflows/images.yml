# Plugin images on ghcr: ghcr.io/<owner>/sokel-plugin-<name>, for linux/amd64 and linux/arm64 (public packages,
# linked to this repository through the image source label).
#
#   push to main   -> :latest and :sha-<commit>
#   a release (tag <plugin>/vX.Y.Z, see release.yml) -> :X.Y.Z, pinned by digest in the catalog entry
name: Images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  list:
    runs-on: ubuntu-latest
    outputs:
      plugins: ${{ steps.l.outputs.plugins }}
    steps:
      - uses: actions/checkout@v4
      - id: l
        run: echo "plugins=$(for d in */; do d=${d%/}; [ -f "$d/go.mod" ] && [ -f "$d/main.go" ] && echo "$d"; done | jq -R . | jq -cs .)" >> "$GITHUB_OUTPUT"

  image:
    needs: list
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        plugin: ${{ fromJSON(needs.list.outputs.plugins) }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/sokel-plugin-${{ matrix.plugin }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: |
            PLUGIN=${{ matrix.plugin }}
            VERSION=${{ steps.meta.outputs.version }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          cache-from: type=gha,scope=${{ matrix.plugin }}
          cache-to: type=gha,mode=max,scope=${{ matrix.plugin }}
