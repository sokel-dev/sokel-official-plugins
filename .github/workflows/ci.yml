# Every plugin: formatted, vetted, built, tested, and its generated code current (sokel-gen check).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  list:
    runs-on: ubuntu-latest
    outputs:
      plugins: ${{ steps.l.outputs.plugins }}
    steps:
      - uses: actions/checkout@v4
      - id: l
        run: |
          plugins=$(python3 scripts/plugin-matrix.py)
          echo "plugins=$plugins" >> "$GITHUB_OUTPUT"

  plugin:
    needs: list
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.list.outputs.plugins) }}
    defaults:
      run:
        working-directory: ${{ matrix.plugin }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.26', cache-dependency-path: '**/go.sum' }
      - name: gofmt
        if: matrix.runtime == 'go'
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "::error::not formatted:"; echo "$out"; exit 1; fi
      - if: matrix.runtime == 'go'
        run: go vet ./...
      - if: matrix.runtime == 'go'
        run: go test -race ./...
      - name: generated code is current
        if: matrix.runtime == 'go'
        run: GOFLAGS=-mod=mod go run github.com/sokel-dev/sokel-plugin-sdk/cmd/sokel-gen check .
      - uses: actions/setup-python@v5
        if: matrix.runtime == 'python'
        with: { python-version: '3.12' }
      - name: Python tests and generated contract
        if: matrix.runtime == 'python'
        run: |
          pip install -r requirements.txt
          python -m unittest discover -v
          go install github.com/sokel-dev/sokel-plugin-sdk/cmd/sokel-gen@v0.7.6
          sokel-gen check .

  release-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pyyaml
      - run: python -m unittest discover -s scripts -p 'test_*.py' -v
