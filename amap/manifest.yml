- desc: Performs one geocoding request; no automatic health check is registered
  id: verify_credential
  inputs:
  - label: Probe address
    name: address
    required: true
    type: string
  label: Verify key with a quota-consuming lookup
  outputs:
  - label: Available
    name: ok
    required: true
    type: boolean
  - label: Message
    name: message
    required: true
    type: string
  timeoutSec: 60
