      type: number
    - goType: int
      label: Page size
      name: page_size
      type: number
    - goType: int
      label: Search radius in meters
      name: radius
      type: number
    - label: Sort rule
      name: sort
      type: string
    goType: NearbyOptions
    label: Nearby search options
    name: options
    type: json
  label: Search nearby places
  outputs:
  - fields:
    - label: Place ID
      name: id
      required: true
      type: string
    - label: Name
      name: name
      required: true
      type: string
    - label: Address
      name: address
      required: true
      type: string
    - label: Longitude and latitude
      name: location
      required: true
      type: string
    - label: Place category
      name: type
      required: true
      type: string
    - label: Category code
      name: typecode
      required: true
      type: string
    - label: Province
      name: province
      required: true
      type: string
    - label: City
      name: city
      required: true
      type: string
    - label: District
      name: district
      required: true
      type: string
    - label: Administrative code
      name: adcode
      required: true
      type: string
    goType: Place
    label: Places
    name: places
    required: true
    type: array
  - goType: int
    label: Returned count
    name: returned_count
    required: true
    type: number
  - goType: int
    label: Next page
    name: next_page
    required: true
    type: number
  - label: More results
    name: has_more
    required: true
    type: boolean
  - label: Page limit reached
    name: page_limit_reached
    required: true
    type: boolean
  timeoutSec: 60
- id: search_places
  inputs:
  - label: Search query
    name: query
